name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Python quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints.txt

      - name: Show Python and pip versions
        run: |
          python --version
          python -m pip --version

      - name: Install project and development dependencies
        run: |
          python -m pip install \
            -c requirements/constraints.txt \
            -e ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Smoke-test imports
        run: |
          python -c "import predictive_maintenance; print('Package import: PASSED')"
          python -c "from predictive_maintenance.api.main import app; print('FastAPI import: PASSED')"

      - name: Run Phase 2.3 quality gate
        run: |
          python -m pytest \
            --cov=predictive_maintenance \
            --cov-report=term-missing \
            -q

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs:
      - quality-gate

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            -t predictive-maintenance-api:ci \
            .

      - name: Smoke-test container package
        run: |
          docker run --rm \
            predictive-maintenance-api:ci \
            python -c "import predictive_maintenance; print('Container package import: PASSED')"

      - name: Smoke-test inference pipeline
        run: |
          docker run --rm \
            predictive-maintenance-api:ci \
            python -c "from predictive_maintenance.inference.pipeline import create_default_inference_pipeline; create_default_inference_pipeline(); print('Container inference pipeline: PASSED')" 

      - name: Start containerized service
        run: |
          docker run -d \
            --name pm-api-ci \
            -p 8000:8000 \
            predictive-maintenance-api:ci

      - name: Verify containerized health endpoint
        run: |
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              echo "Containerized health check: PASSED"
              exit 0
            fi

            sleep 1
          done

          echo "Containerized health check: FAILED"
          docker logs pm-api-ci
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm -f pm-api-ci || true