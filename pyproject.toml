[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "Predictive maintenance and MLOps project using NASA C-MAPSS turbofan degradation data"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "numpy>=2.4.4,<3",
    "pandas>=3.0.2,<4",
    "scikit-learn>=1.8.0,<2",
    "joblib>=1.5.3,<2",
    "fastapi>=0.141.1,<1",
    "pydantic>=2.13.4,<3",
    "uvicorn[standard]>=0.52.1,<1",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.5.6,<5",
    "ipykernel>=7.2.0,<8",
    "matplotlib>=3.10.8,<4",
]

mlops = [
    "mlflow",
    "evidently",
    "prometheus-client",
]

dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "httpx>=0.28.1,<0.29",
]

demo = [
    "streamlit>=1.66,<2",
    "httpx>=0.28.1,<0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = [
    "predictive_maintenance",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true