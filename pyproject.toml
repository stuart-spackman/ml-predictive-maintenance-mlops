[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "Predictive maintenance and MLOps project using NASA C-MAPSS turbofan degradation data"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "joblib",
    "tqdm",
    "python-dotenv",
    "pyyaml",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab",
    "ipykernel",
]

mlops = [
    "mlflow",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "evidently",
    "prometheus-client",
]

dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]